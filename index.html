<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>아웃라인 다이어그램 라이브러리</title>
<!--
  GitHub Pages 배포: 이 파일을 리포지토리에 index.html로 커밋한 뒤
  Settings → Pages → Deploy from branch 로 활성화하면 바로 접속 가능합니다.
  외부 의존성은 Google Fonts CDN 하나뿐이며, 그 외에는 순수 HTML/CSS/JS로만
  동작하고 문서·노트 데이터는 브라우저의 localStorage에 저장됩니다.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@400;600;700&family=Gothic+A1:wght@400;700;900&family=Jua&family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<style>
  :root {
    --ink: #111111; --paper: #FFFFFF;
    --gray-50: #FAFAFA; --gray-100: #F2F2F0; --gray-200: #E7E5E0; --gray-300: #D6D3CB;
    --gray-500: #8A8680; --gray-700: #46433D; --danger: #B23A2E;
    --ui-font: "Pretendard", -apple-system, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --doc-font: "Noto Sans KR", var(--ui-font);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--ui-font); color: var(--ink); background: var(--paper); overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; background: none; }
  input, select, textarea { font-family: inherit; }
  svg.icon { width: 15px; height: 15px; flex-shrink: 0; }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .screen { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .screen.active { display: flex; }

  .tbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--gray-300); border-radius: 7px; padding: 6px 11px; font-size: 12px; color: var(--gray-700); background: var(--paper); transition: background .12s, color .12s, border-color .12s; white-space: nowrap; }
  .tbtn:hover { border-color: var(--ink); color: var(--ink); }
  .tbtn.active { border-color: var(--ink); color: var(--paper); background: var(--ink); }
  select.tbtn { appearance: none; padding-right: 24px; background-image: linear-gradient(45deg, transparent 50%, var(--gray-700) 50%), linear-gradient(135deg, var(--gray-700) 50%, transparent 50%); background-position: calc(100% - 12px) 55%, calc(100% - 7px) 55%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  .primary-btn { display: inline-flex; align-items: center; gap: 7px; background: var(--ink); color: #fff; border-radius: 7px; padding: 8px 15px; font-size: 12px; border: none; font-weight: 600; white-space: nowrap; }
  .primary-btn:hover { background: #000; }
  .linklike { font-size: 11.5px; color: var(--gray-500); background: none; border: none; }
  .linklike:hover { color: var(--ink); }
  .eyebrow { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10px; letter-spacing: .14em; color: var(--gray-500); text-transform: uppercase; }
  .eyebrow-sm { font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--gray-500); }

  /* 키보드 포커스 표시 (접근성) */
  .tbtn:focus-visible, .primary-btn:focus-visible, .linklike:focus-visible, .icbtn:focus-visible,
  button:focus-visible, .zoomctl button:focus-visible, .npSecondaryBtn:focus-visible, .npResetBtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }

  /* 관련 버튼들을 시각적으로 묶어주는 그룹 구분선/칩 */
  .tgroup { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tbar-divider { width: 1px; align-self: stretch; min-height: 18px; background: var(--gray-200); flex-shrink: 0; }
  @media (max-width: 640px) { .tbar-divider { display: none; } }
  #exportBar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .exportGroup { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 9px; padding: 5px 8px; }
  .exportOmitLabel { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--gray-700); cursor: pointer; white-space: nowrap; }
  .exportOmitLabel input { accent-color: var(--ink); }

  /* 텍스트 트리 미리보기: 줄바꿈 없이 가로 스크롤 → 트리 선이 깨지지 않음 */
  .treeOpts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .treeOptRow { display: flex; gap: 8px; }
  .treeOptRow > label { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--gray-500); }
  .treeChecks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .treePre { margin: 0; padding: 12px 14px; background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 8px; font-family: "D2Coding", "Sarasa Mono K", ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK KR", monospace; font-size: 12.5px; line-height: 1.55; white-space: pre; overflow: auto; max-height: 50vh; tab-size: 4; -webkit-text-size-adjust: none; color: var(--ink); }
  .treeMeta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0 12px; font-size: 11px; color: var(--gray-500); font-family: ui-monospace, monospace; }
  .treeFoot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  @media (max-width: 640px) { .treePre { font-size: 12px; padding: 10px; } }
  .treePresets { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--gray-200); }
  .treePreset { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--gray-100); flex-wrap: wrap; }
  .treePreset:last-child { border-bottom: none; }
  .treePresetInfo { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 180px; }
  .treePresetName { font-size: 13px; font-weight: 600; color: var(--ink); }
  .treePresetHint { font-size: 11px; color: var(--gray-500); line-height: 1.5; }
  .treePresetBtns { display: flex; gap: 6px; flex-shrink: 0; }

  /* ================= LIBRARY SCREEN ================= */
  #libHeader { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--gray-200); flex-wrap: wrap; }
  .libTitleRow { display: flex; align-items: baseline; gap: 9px; }
  .libTitle { font-size: 15px; font-weight: 700; }
  #libTabs { display: flex; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--gray-200); }
  #libTabs button { padding: 7px 14px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--gray-500); border: 1px solid transparent; }
  #libTabs button.active { color: var(--ink); background: var(--gray-100); border-color: var(--gray-200); }
  #libBody { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 40px; background: var(--gray-50); }
  .libGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .libEmpty { text-align: center; color: var(--gray-500); font-size: 13px; padding: 60px 20px; line-height: 1.8; }
  .libEmpty .primary-btn { margin: 6px; }
  .libCard { background: var(--paper); border: 1px solid var(--gray-200); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; transition: box-shadow .12s, border-color .12s; }
  .libCard:hover { border-color: var(--gray-300); box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .libCardTitle { font-size: 14px; font-weight: 700; word-break: break-word; cursor: pointer; }
  .libCardTitle:hover { text-decoration: underline; }
  .libCardMeta { font-size: 11px; color: var(--gray-500); font-family: ui-monospace, monospace; }
  .libCardBtns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .libCardBtns .tbtn { padding: 5px 9px; font-size: 11px; }
  #addDocBtn, #addNoteBtn { margin-bottom: 14px; }

  .dragRow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--gray-200); border-radius: 8px; margin-bottom: 6px; background: var(--paper); }
  .dragRow.dragging { opacity: .4; }
  .dragHandle { color: var(--gray-300); cursor: grab; flex-shrink: 0; }
  .dragLabel { flex: 1; font-size: 13px; min-width: 0; word-break: break-word; }
  .dragRow .icbtn { flex-shrink: 0; }

  /* ================= EDITOR SCREEN ================= */
  #toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--gray-200); background: var(--paper); flex-shrink: 0; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  #docTitleInput { border: 1px solid transparent; border-radius: 6px; padding: 5px 7px; font-size: 14px; font-weight: 700; color: var(--ink); background: transparent; outline: none; min-width: 60px; max-width: 260px; }
  #docTitleInput:focus, #docTitleInput:hover { border-color: var(--gray-300); background: var(--gray-50); }
  .toolbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  #mobileTabs { display: none; border-bottom: 1px solid var(--gray-200); flex-shrink: 0; }
  #mobileTabs button { flex: 1; padding: 11px; font-size: 13px; font-weight: 600; color: var(--gray-500); border-bottom: 2px solid transparent; background: var(--paper); }
  #mobileTabs button.active { color: var(--ink); border-bottom-color: var(--ink); }

  /* ================= ZOOM BREADCRUMB (Dynalist-style zoom-in) ================= */
  #zoomBar { display: none; align-items: center; gap: 2px; padding: 8px 14px; border-bottom: 1px solid var(--gray-200); flex-wrap: wrap; background: var(--gray-50); flex-shrink: 0; }
  #zoomBar.show { display: flex; }
  #zoomBar .zcrumb { font-size: 12px; color: var(--gray-500); padding: 4px 7px; border-radius: 6px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 1px solid transparent; background: none; }
  #zoomBar .zcrumb:hover { color: var(--ink); background: var(--gray-100); }
  #zoomBar .zcrumb.current { color: var(--ink); font-weight: 700; }
  #zoomBar .zsep { color: var(--gray-300); font-size: 11px; padding: 0 1px; }
  #zoomBar .zoomOutBtn { margin-left: auto; flex-shrink: 0; }
  .icbtn.mdActive { color: var(--ink); background: var(--gray-100); border-color: var(--gray-300); }

  #main { flex: 1; min-height: 0; display: flex; }
  #editorPane, #previewPane { display: flex; flex-direction: column; min-height: 0; }
  #editorPane { width: 38%; min-width: 300px; border-right: 1px solid var(--gray-200); transition: none; }
  #main.sidebar-collapsed #editorPane { display: none; }
  body.mobile-mode #sidebarToggleBtn { display: none; }
  #previewPane { flex: 1; min-width: 0; }

  .paneSection { border-bottom: 1px solid var(--gray-200); flex-shrink: 0; }
  .paneHead { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; font-size: 11px; color: var(--gray-700); }
  #pasteBox { width: 100%; min-height: 130px; max-height: 220px; resize: vertical; border: 1px solid var(--gray-300); border-radius: 8px; padding: 10px 11px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; line-height: 1.55; color: var(--ink); outline: none; background: var(--gray-50); }
  #pasteBox:focus { border-color: var(--ink); background: var(--paper); }
  #pasteSection { border-bottom: 1px solid var(--gray-200); flex-shrink: 0; }
  .pasteToggleBtn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 11px 16px; font-size: 12px; font-weight: 600; color: var(--gray-700); text-align: left; }
  .pasteToggleBtn:hover { color: var(--ink); background: var(--gray-50); }
  .pasteToggleIcon { display: inline-block; font-size: 10px; color: var(--gray-500); transition: transform .12s; width: 10px; }
  #pasteSection.collapsed #pasteWrap { display: none; }
  #pasteSection.collapsed .pasteToggleIcon { transform: rotate(0deg); }
  #pasteSection:not(.collapsed) .pasteToggleIcon { transform: rotate(90deg); }
  #pasteWrap { padding: 0 16px 14px; }
  #listToolbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--gray-200); flex-shrink: 0; }
  #multiSelectToggle { font-size: 11px; padding: 5px 10px; }

  #floatZoom { position: absolute; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 3px; background: var(--gray-100); border: 1px solid var(--gray-300); border-radius: 20px; padding: 4px 6px; box-shadow: 0 1px 4px rgba(0,0,0,.08); z-index: 3; }
  #floatZoom button { width: 24px; height: 24px; border-radius: 50%; color: var(--gray-700); display: flex; align-items: center; justify-content: center; }
  #floatZoom button:hover { color: var(--ink); background: var(--gray-100); }
  #floatZoom .zoomlbl { font-family: ui-monospace, monospace; font-size: 10.5px; color: var(--gray-700); width: 34px; text-align: center; }

  #selectionBar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--ink); color: #fff; align-items: center; justify-content: space-between; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); gap: 10px; flex-wrap: wrap; }
  #selectionBar.show { display: flex; }
  #selectionBar .selCount { font-size: 12.5px; font-weight: 600; }
  #selectionBar .selBtns { display: flex; gap: 8px; flex-wrap: wrap; }
  #selectionBar button.selBtn { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 7px; padding: 7px 12px; font-size: 12px; }
  #selectionBar button.selBtn:hover { background: rgba(255,255,255,.22); }
  #selectionBar button.selBtn.primary { background: #fff; color: var(--ink); font-weight: 700; }
  body.mobile-mode #selectionBar { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }

  #importBtn { margin-top: 8px; width: 100%; justify-content: center; }
  .paste-hint { font-size: 11px; color: var(--gray-500); line-height: 1.5; margin-top: 8px; }

  #listScroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 8px 90px; }
  .lrow { display: flex; align-items: center; gap: 4px; padding: 3px 0; border-radius: 5px; }
  .lrow.focused { background: var(--gray-100); }
  .lrow .lguides { display: flex; flex-shrink: 0; }
  .lrow .lguide { width: 16px; position: relative; flex-shrink: 0; height: 28px; }
  .lrow .lguide::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 1px; background: var(--gray-200); }
  .lrow .lvl { font-family: ui-monospace, monospace; font-size: 9px; color: var(--gray-300); width: 14px; flex-shrink: 0; text-align: center; }
  .lrow input.ltext { flex: 1; min-width: 0; border: none; border-bottom: 1px solid transparent; background: transparent; outline: none; font-size: 14px; color: var(--ink); padding: 5px 3px; font-family: var(--doc-font); }
  .lrow input.ltext:focus { border-bottom-color: var(--ink); }
  .lrow .lbtns { display: flex; gap: 1px; flex-shrink: 0; }
  .icbtn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 5px; color: var(--gray-500); border: 1px solid transparent; flex-shrink: 0; }
  .icbtn:hover { color: var(--ink); background: var(--gray-100); }
  .icbtn svg { width: 12px; height: 12px; }
  .icbtn.danger:hover { color: var(--danger); }
  .lrow .badge { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .lrow .dragHandleSm { color: var(--gray-300); cursor: grab; flex-shrink: 0; width: 13px; display: flex; align-items: center; justify-content: center; }
  .lrow .dragHandleSm:hover { color: var(--gray-500); }
  .lrow .dragHandleSm svg { width: 11px; height: 11px; }
  .lrow.dragging { opacity: .4; }
  .lrow.dragOver-before { box-shadow: inset 0 2px 0 var(--ink); }
  .lrow.dragOver-after { box-shadow: inset 0 -2px 0 var(--ink); }
  .lrow .foldBtn { width: 15px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--gray-500); border-radius: 3px; font-size: 9px; border: none; background: none; }
  .lrow .foldBtn:hover { color: var(--ink); background: var(--gray-100); }
  .lrow .foldSpacer { width: 15px; flex-shrink: 0; }
  #diagramModeToggle.active { border-color: var(--ink); color: var(--paper); background: var(--ink); }
  #addRootBtn { display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--gray-300); color: var(--gray-700); background: var(--paper); border-radius: 7px; padding: 8px 12px; font-size: 12px; margin: 8px 4px 0; width: calc(100% - 8px); justify-content: center; transition: border-color .12s, color .12s; }
  #addRootBtn:hover { border-color: var(--ink); color: var(--ink); }

  #svgOuter { flex: 1; min-height: 0; position: relative; display: flex; }
  #svgWrap { flex: 1; min-height: 0; overflow: auto; padding: 24px; background: var(--gray-50); }
  #canvasFrame { position: relative; display: inline-block; border: 1px solid var(--gray-200); box-shadow: 0 1px 2px rgba(0,0,0,.05); background: #fff; }
  .crop { position: absolute; width: 10px; height: 10px; border: 0 solid var(--ink); z-index: 2; opacity: .5; }
  .crop.nw { top: -1px; left: -1px; border-top-width: 1.5px; border-left-width: 1.5px; }
  .crop.ne { top: -1px; right: -1px; border-top-width: 1.5px; border-right-width: 1.5px; }
  .crop.sw { bottom: -1px; left: -1px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
  .crop.se { bottom: -1px; right: -1px; border-bottom-width: 1.5px; border-right-width: 1.5px; }

  #previewFoot { display: flex; align-items: center; justify-content: space-between; padding: 11px 18px; border-top: 1px solid var(--gray-200); background: var(--paper); flex-shrink: 0; gap: 10px; flex-wrap: wrap; }
  .dims { font-family: ui-monospace, monospace; font-size: 10px; color: var(--gray-500); }
  .zoomctl { display: flex; align-items: center; gap: 3px; }
  .zoomctl button { width: 26px; height: 26px; border: 1px solid var(--gray-300); border-radius: 6px; color: var(--gray-700); display: flex; align-items: center; justify-content: center; }
  .zoomctl button:hover { border-color: var(--ink); color: var(--ink); }
  .zoomlbl { font-family: ui-monospace, monospace; font-size: 11px; color: var(--gray-700); width: 38px; text-align: center; }
  .lw-ctl { display: flex; align-items: center; gap: 6px; }
  .lw-ctl label { font-size: 11px; color: var(--gray-500); font-family: ui-monospace, monospace; }
  .lw-ctl input[type=range] { width: 64px; accent-color: var(--ink); }
  .lw-ctl .lwval { font-family: ui-monospace, monospace; font-size: 11px; color: var(--ink); width: 14px; }
  #canvasWidthVal { width: 44px; text-align: left; }
  #canvasWidthRange { width: 84px; }

  #mobileBar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--paper); border-top: 1px solid var(--gray-200); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); gap: 2px; box-shadow: 0 -2px 10px rgba(0,0,0,.05); }
  #mobileBar.show { display: flex; }
  #mobileBar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 8px 2px; border-radius: 9px; color: var(--ink); font-size: 9px; border: 1px solid transparent; }
  #mobileBar button:active { background: var(--gray-100); border-color: var(--gray-300); }
  #mobileBar button svg { width: 18px; height: 18px; }

  /* ================= NOTEBOOK VIEWER SCREEN ================= */
  #nbHeader { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--gray-200); flex-shrink: 0; }
  #nbHeaderLeft { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #nbTitle { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #nbPageIndicator { font-family: ui-monospace, monospace; font-size: 11px; color: var(--gray-500); }
  #nbViewport { flex: 1; min-height: 0; position: relative; background: var(--gray-50); }
  #nbPages { height: 100%; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
  .nbPage { flex: 0 0 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; padding: 30px 50px; position: relative; }
  .nbPage svg { max-width: 100%; max-height: 100%; width: auto; height: auto; background: #fff; border: 1px solid var(--gray-200); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .nbPageTitle { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--gray-500); font-family: ui-monospace, monospace; background: rgba(255,255,255,.85); padding: 3px 10px; border-radius: 12px; }
  .nbMissing { color: var(--gray-500); font-size: 13px; }
  .nbNav { position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--gray-300); background: rgba(255,255,255,.9); display: flex; align-items: center; justify-content: center; color: var(--ink); z-index: 5; }
  .nbNav:hover { border-color: var(--ink); }

  .mdRender h2 { font-size: 1.35em; margin: 1.1em 0 .5em; }

  .mdRender h4 { font-size: 1.02em; margin: .9em 0 .4em; }

  .mdRender li > p { margin: .2em 0; }
  .mdRender blockquote { margin: .8em 0; padding: .5em 1em; border-left: 3px solid var(--gray-300); color: var(--gray-700); background: var(--gray-50); border-radius: 0 6px 6px 0; }
  .mdRender code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .88em; background: var(--gray-100); padding: .15em .4em; border-radius: 4px; }
  .mdRender pre { background: var(--gray-100); padding: 12px 15px; border-radius: 8px; overflow-x: auto; margin: .8em 0; }

  .mdRender th { background: var(--gray-50); font-weight: 700; }
  .mdRender img { max-width: 100%; border-radius: 6px; }
  .mdRender a { color: #2B6CB0; text-decoration: underline; }
  .mdRender hr { border: none; border-top: 1px solid var(--gray-200); margin: 1.3em 0; }
  .mdRender input[type=checkbox] { accent-color: var(--ink); margin-right: 4px; }

  body.mobile-mode #mobileTabs { display: flex; }
  body.mobile-mode #main { flex-direction: column; }
  body.mobile-mode #editorPane, body.mobile-mode #previewPane { width: 100%; min-width: 0; border-right: none; display: none; flex: 1; }
  body.mobile-mode.tab-edit #editorPane { display: flex; }
  body.mobile-mode.tab-preview #previewPane { display: flex; }

  body.mobile-mode #listScroll { padding-bottom: 84px; }

<body>
<div id="app">

  <!-- ================= LIBRARY ================= -->
  <div id="screenLibrary" class="screen">
    <div id="libHeader">
      <div class="libTitleRow"><span class="eyebrow">LIBRARY</span><span class="libTitle">다이어그램 라이브러리</span></div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button id="libBackupBtn" class="tbtn"></button>
        <button id="libImportBtn" class="tbtn"></button>
      </div>
    </div>
    <input type="file" id="libraryImportFile" accept=".json,application/json" style="display:none">
    <input type="file" id="docImportFile" accept=".json,application/json" style="display:none">
    <div id="libTabs">
      <button data-tab="docs" class="active">문서</button>
      <button data-tab="notes">노트</button>
    </div>
    <div id="libBody"></div>
  </div>

  <!-- ================= EDITOR ================= -->
  <div id="screenEditor" class="screen">
    <div id="toolbar">
      <div class="brand">
        <button id="backToLibBtn" class="tbtn" title="라이브러리로"></button>
        <input id="docTitleInput" type="text" placeholder="제목 없음" />
      </div>
      <div class="toolbar-right">
        <div class="tgroup">
          <button id="saveDocBtn" class="primary-btn"></button>
          <select id="fontSelect" class="tbtn" title="글꼴 선택"></select>
        </div>
        <span class="tbar-divider"></span>
        <div class="tgroup">
          <button id="diagramModeToggle" class="tbtn" title="다이어그램 구조: 가로로 넓어지는 트리 ↔ 세로로 들여쓰는 아웃라인"></button>
          <button id="mobileToggle" class="tbtn" title="모바일 최적화 모드 전환"></button>
          <button id="sidebarToggleBtn" class="tbtn" title="아웃라인 사이드바 접기/펼치기"></button>
          <button id="settingsBtn" class="tbtn" title="폰트 크기 · 굵기 · 연결선 굵기 · 표시 범위"></button>
        </div>
      </div>
    </div>

    <div id="mobileTabs">
      <button data-tab="edit" class="active">편집</button>
      <button data-tab="preview">다이어그램</button>
    </div>

    <div id="zoomBar"></div>

    <div id="main">
      <div id="editorPane">
        <div id="pasteSection" class="collapsed">
          <button id="pasteToggle" class="pasteToggleBtn">
            <span id="pasteToggleIcon" class="pasteToggleIcon">▸</span>
            <span>아웃라인 붙여넣기</span>
          </button>
          <div id="pasteWrap">
            <textarea id="pasteBox" spellcheck="false" placeholder="다이날리스트에서 'Copy as Formatted'로 복사한 내용, 또는 이 앱의 '텍스트 트리'로 내보낸 내용을 여기에 붙여넣으세요."></textarea>
            <button id="importBtn" class="primary-btn"></button>
            <p class="paste-hint">탭(또는 하이픈 들여쓰기)으로 된 다이날리스트 · 워크플로위 형식 텍스트를 인식합니다. 항목에 딸린 노트(메모) 줄은 자동으로 작은 글씨 메모로 들어갑니다.</p>
          </div>
        </div>
        <div id="listToolbar">
          <button id="multiSelectToggle" class="tbtn"></button>
          <div style="display:flex; gap:12px;">
            <button id="demoBtn" class="linklike">예시</button>
            <button id="clearBtn" class="linklike" style="color:var(--danger)">전체 지우기</button>

        <div id="listScroll">
          <div id="listBody"></div>

      <div id="previewPane">
        <div id="svgOuter">
          <div id="svgWrap">
            <div id="canvasFrame">
              <span class="crop nw"></span><span class="crop ne"></span><span class="crop sw"></span><span class="crop se"></span>
              <svg id="treeSvg" xmlns="http://www.w3.org/2000/svg"></svg>
            </div>
          </div>
          <div id="floatZoom">
            <button id="zoomOut">−</button>
            <span class="zoomlbl" id="zoomLbl">100%</span>
            <button id="zoomIn">+</button>

          </div>
        </div>

              <button id="exportOutlineCopyBtn" class="tbtn" title="클립보드로 복사">복사</button>
              <button id="exportOutlineBtn" class="tbtn" title="현재 아웃라인을 텍스트 파일로 내보내기">파일로</button>

            <span class="tbar-divider"></span>
            <div class="exportGroup" title="다이어그램을 이미지·문서로 내보내기">

    </div>
    <div id="mobileBar"></div>

</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // storage (graceful fallback to in-memory if localStorage is blocked,
  // e.g. inside a sandboxed preview)
  // ---------------------------------------------------------------------
  var memStore = {};
  function safeGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null; } }
  function safeSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { memStore[k] = v; } }
  var LIB_KEY = "outlineTreeLibrary_v1";

  function loadLibrary() {
    var raw = safeGet(LIB_KEY);
    var base = { documents: {}, notebooks: {}, documentOrder: [], notebookOrder: [] };
    if (!raw) return base;
    try { return Object.assign(base, JSON.parse(raw)); } catch (e) { return base; }
  }
  function saveLibrary() { safeSet(LIB_KEY, JSON.stringify(state.library)); }
  function fmtDate(ts) {
    var d = new Date(ts);
    function p(n) { return String(n).padStart(2, "0"); }
    return d.getFullYear() + "." + p(d.getMonth() + 1) + "." + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function newDocId() { return "doc_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7); }
  function newNbId() { return "nb_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7); }
  function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

  // ---------------------------------------------------------------------
  // icons
  // ---------------------------------------------------------------------
  function icon(inner) { return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>'; }
  var ICONS = {
    indent: icon('<path d="M9 6l6 6-6 6"/><line x1="3" y1="4" x2="3" y2="20"/>'),
    outdent: icon('<path d="M15 6l-6 6 6 6"/><line x1="21" y1="4" x2="21" y2="20"/>'),
    up: icon('<polyline points="6 15 12 9 18 15"/>'),
    down: icon('<polyline points="6 9 12 15 18 9"/>'),
    trash: icon('<polyline points="4 7 6.5 7 20 7"/><path d="M18.2 7 17.3 19.5a2 2 0 0 1-2 1.8H8.7a2 2 0 0 1-2-1.8L5.8 7"/><line x1="10" y1="11" x2="10" y2="16"/><line x1="14" y1="11" x2="14" y2="16"/><path d="M9 7V4.8A1 1 0 0 1 10 4h4a1 1 0 0 1 1 .8V7"/>'),
    x: icon('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'),

  // ---------------------------------------------------------------------

  function parseOutlineText(raw) {
    var rawLines = raw.replace(/\r\n/g, "\n").split("\n");

    rawLines.forEach(function (l) {
      if (l.trim() === "") return;

    });
    if (lines.length === 0) return [];
    var spaceCounts = lines.map(function (l) { return l.indent.replace(/\t/g, "").length; }).filter(function (n) { return n > 0; });
    var spaceStep = spaceCounts.length ? Math.min.apply(null, spaceCounts) : 2;
    if (spaceStep === 0) spaceStep = 2;
    function levelOf(indentStr) {
      var tabCount = (indentStr.match(/\t/g) || []).length;
      var spaceCount = indentStr.replace(/\t/g, "").length;
      var lvl = tabCount;
      if (spaceCount > 0) lvl += Math.round(spaceCount / spaceStep);
      return lvl;
    }
    var bulletRe = /^[-*•]\s+(.*)$/;
    var bulletCount = lines.filter(function (l) { return bulletRe.test(l.content); }).length;
    var bulletFormat = bulletCount >= Math.ceil(lines.length * 0.4);
    var items = [];
    lines.forEach(function (l) {
      var lvl = levelOf(l.indent);
      var m = l.content.match(bulletRe);
      if (bulletFormat && m) {
        var text = m[1].trim();
        var checkbox = text.match(/^\[( |x|X)\]\s*(.*)$/);
        if (checkbox) text = (checkbox[1].toLowerCase() === "x" ? "☑ " : "☐ ") + checkbox[2];
        items.push({ id: nextId(), text: text, level: lvl, note: "" });
      } else if (bulletFormat && !m) {
        if (items.length > 0) {
          var prev = items[items.length - 1];
          prev.note = prev.note ? (prev.note + "\n" + l.content.trim()) : l.content.trim();
        } else { items.push({ id: nextId(), text: l.content.trim(), level: lvl, note: "" }); }
      } else { items.push({ id: nextId(), text: l.content.replace(bulletRe, "$1").trim(), level: lvl, note: "" }); }

  // ---------------------------------------------------------------------

  // 아웃라인으로 되돌리는 파서. 트리 연결선이 하나도 안 보이면 null을 돌려줘서

  var TREE_MARKER_CANDIDATES = [

    ["|-- ", "tee"], ["`-- ", "elbow"],

  function stripTreeLinePrefix(line) {

    // 한 글자씩 소비하기 전에 그 위치에서 마커가 시작되는지 먼저 확인한다.
    var i = 0;
    while (i < line.length && !matchTreeMarker(line.slice(i)) && (line[i] === " " || line[i] === "\t" || line[i] === "│" || line[i] === "|")) i++;

    var hit = matchTreeMarker(rest);

  function parseTreeDiagramText(raw) {

    if (fenced) text = fenced[1];
    var rawLines = text.split("\n");
    var parsedLines = rawLines.map(function (line) {
      if (line.trim() === "") return { blank: true };
      var p = stripTreeLinePrefix(line);
      return { blank: false, prefixLen: p.prefixLen, marker: p.marker, content: p.content.replace(/\s+$/, "") };
    });
    var hasMarker = parsedLines.some(function (l) { return !l.blank && l.marker; });
    if (!hasMarker) return null;      // 텍스트 트리 형식이 아닌 것 같음 → 다른 파서에 맡김

    var unit = null;
    parsedLines.forEach(function (l) {
      if (!l.blank && l.marker && l.prefixLen > 0 && (unit === null || l.prefixLen < unit)) unit = l.prefixLen;
    });
    if (!unit) unit = 4;

    var items = [];
    var lastTarget = null;   // { kind: 'text'|'note', ref: item } — 줄바꿈으로 이어진 다음 줄을 어디에 붙일지
    var prevWasBlank = true;
    parsedLines.forEach(function (l) {
      if (l.blank) { prevWasBlank = true; return; }
      var content = l.content;
      if (!content.trim()) { prevWasBlank = true; return; }
      if (l.marker) {
        var lvl = Math.max(0, Math.round(l.prefixLen / unit));
        var t = content.trim();
        var cb = t.match(/^\[( |x|X)\]\s*(.*)$/);
        var item = { id: nextId(), text: t, level: lvl, note: "" };
        if (cb) { item.checkbox = true; item.checked = cb[1].toLowerCase() === "x"; item.text = cb[2]; }
        items.push(item);
        lastTarget = { kind: "text", ref: item };
      } else if (/^·\s?/.test(content.trim())) {
        var noteText = content.trim().replace(/^·\s?/, "");
        if (items.length) {
          var owner = items[items.length - 1];
          owner.note = owner.note ? (owner.note + "\n" + noteText) : noteText;
          lastTarget = { kind: "note", ref: owner };
        }
      } else if (l.prefixLen === 0 && prevWasBlank) {
        var rootItem = { id: nextId(), text: content.trim(), level: 0, note: "" };
        items.push(rootItem);
        lastTarget = { kind: "text", ref: rootItem };
      } else if (lastTarget) {
        if (lastTarget.kind === "note") lastTarget.ref.note = (lastTarget.ref.note + " " + content.trim()).trim();
        else lastTarget.ref.text = (lastTarget.ref.text + " " + content.trim()).trim();
      } else {
        var soloItem = { id: nextId(), text: content.trim(), level: 0, note: "" };
        items.push(soloItem);
        lastTarget = { kind: "text", ref: soloItem };
      }
      prevWasBlank = false;
    });
    return items.length ? normalizeLevels(items) : null;
  }

  function importFromPaste() {

  // ---------------------------------------------------------------------
  // tree structural helpers (flat items array)
  // ---------------------------------------------------------------------
  function indexOfId(id) { for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return i; return -1; }
  function subtreeEnd(idx) { var lvl = state.items[idx].level, i = idx + 1; while (i < state.items.length && state.items[i].level > lvl) i++; return i; }
  function hasChildren(idx) { return idx + 1 < state.items.length && state.items[idx + 1].level > state.items[idx].level; }

  function indentItem(id) {
    var idx = indexOfId(id);
    if (idx <= 0) return;
    var maxAllowed = state.items[idx - 1].level + 1;
    if (state.items[idx].level >= maxAllowed) return;
    var end = subtreeEnd(idx);
    for (var i = idx; i < end; i++) state.items[i].level += 1;
    renderAll();
  }
  function outdentItem(id) {
    var idx = indexOfId(id);

    renderAll();
  }
  function addSiblingAfter(id, text) {
    var idx = indexOfId(id);

    var lvl = state.items[idx].level;
    var insertAt = subtreeEnd(idx);
    var newItem = { id: nextId(), text: text || "", level: lvl };
    state.items.splice(insertAt, 0, newItem);
    return newItem;
  }
  function deleteItem(id) {
    var idx = indexOfId(id);
    if (idx < 0) return;
    if (state.items.length === 1) { state.items[0].text = ""; renderAll(); return; }
    var end = subtreeEnd(idx);
    state.items.splice(idx, end - idx);
    if (state.selectedId === id) state.selectedId = null;
    renderAll();
  }
  function moveItem(id, dir) {
    var idx = indexOfId(id);
    if (idx < 0) return;
    var lvl = state.items[idx].level;
    var end = subtreeEnd(idx);
    if (dir < 0) {
      var p = idx - 1;
      while (p >= 0 && state.items[p].level > lvl) p--;
      if (p < 0 || state.items[p].level !== lvl) return;
      var block = state.items.splice(idx, end - idx);
      state.items.splice.apply(state.items, [p, 0].concat(block));
    } else {
      if (end >= state.items.length || state.items[end].level !== lvl) return;
      var nextEnd = subtreeEnd(end);

      state.items.splice.apply(state.items, [insertAt, 0].concat(block3));

  }

  // ---------------------------------------------------------------------
  // display-range helpers (레벨 제한 / 제목 생략 / 개별 접기)
  // ---------------------------------------------------------------------
  function getRenderItems() {
    var base = state.items;

      }

    if (!state.omitRootTitle) return base;
    return base.filter(function (it) { return it.level > 0; }).map(function (it) { return Object.assign({}, it, { level: it.level - 1 }); });
  }

  // ---------------------------------------------------------------------

  function zoomAncestorChain(id) {

      if (lvl === 0) break;
      var p = idx - 1;

  function renderZoomBar() {

    var chain = zoomAncestorChain(state.zoomRootId);
    if (!chain.length) { bar.classList.remove("show"); return; }
    var homeBtn = document.createElement("button");
    homeBtn.className = "zcrumb"; homeBtn.textContent = "전체 문서";
    homeBtn.addEventListener("click", function () { zoomTo(null); });
    bar.appendChild(homeBtn);
    chain.forEach(function (it, i) {
      var sep = document.createElement("span"); sep.className = "zsep"; sep.textContent = "›";
      bar.appendChild(sep);
      var crumb = document.createElement("button");
      crumb.className = "zcrumb" + (i === chain.length - 1 ? " current" : "");
      crumb.textContent = it.text && it.text.trim() ? it.text : "(제목 없음)";

  function serializeSvg(fromEl) {
    var clone = (fromEl || svgEl).cloneNode(true);
    clone.querySelectorAll("rect[fill='transparent']").forEach(function (r) { r.remove(); });
    clone.querySelectorAll(".foldui").forEach(function (r) { r.remove(); });
    var s = new XMLSerializer().serializeToString(clone);
    return '<?xml version="1.0" standalone="no"?>\r\n' + s;
  }
  function downloadBlob(content, type, filename) {
    var blob = new Blob([content], { type: type });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }
  // SVG를 래스터화된 캔버스로 변환하는 공용 헬퍼 (PNG/PDF 내보내기가 공유)
  function svgToCanvas(fromEl, onDone) {
    var w = parseFloat(fromEl.getAttribute("width")), h = parseFloat(fromEl.getAttribute("height"));
    var blob = new Blob([serializeSvg(fromEl)], { type: "image/svg+xml;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function () {
      var scale = 3;
      var canvas = document.createElement("canvas");
      canvas.width = w * scale; canvas.height = h * scale;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      onDone(canvas, w, h);
    };
    img.onerror = function () { URL.revokeObjectURL(url); onDone(null); };
    img.src = url;
  }
  function svgToPng(fromEl, filename, onDone) {
    svgToCanvas(fromEl, function (canvas) {
      if (!canvas) { alert("PNG 내보내기에 실패했습니다. 다시 시도해 주세요."); if (onDone) onDone(); return; }
      var a = document.createElement("a"); a.href = canvas.toDataURL("image/png"); a.download = filename; a.click();
      if (onDone) onDone();
    });
  }
  // SVG를 A4 용지에 맞춰 PDF로 내보내기 (가로세로 비율에 따라 자동으로 세로/가로 방향 선택, 여백 10mm)
  function svgToPdfA4(fromEl, filename, onDone) {
    svgToCanvas(fromEl, function (canvas, w, h) {
      if (!canvas) { alert("PDF 내보내기에 실패했습니다. 다시 시도해 주세요."); if (onDone) onDone(); return; }
      try {
        var jsPDFCtor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
        var orientation = w >= h ? "l" : "p";
        var pdf = new jsPDFCtor({ orientation: orientation, unit: "mm", format: "a4" });
        var pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight();
        var margin = 10;
        var ratio = Math.min((pageW - margin * 2) / w, (pageH - margin * 2) / h);
        var imgW = w * ratio, imgH = h * ratio;
        var x = (pageW - imgW) / 2, y = (pageH - imgH) / 2;
        pdf.addImage(canvas.toDataURL("image/png"), "PNG", x, y, imgW, imgH);
        pdf.save(filename);
      } catch (e) { alert("PDF 내보내기에 실패했습니다. 다시 시도해 주세요."); }
      if (onDone) onDone();
    });
  }
  function exportSVG() {
    var wasSelected = state.selectedId; state.selectedId = null; renderSVG();
    downloadBlob(serializeSvg(svgEl), "image/svg+xml;charset=utf-8", "tree-diagram.svg");
    state.selectedId = wasSelected; renderSVG();

  function exportPNG() {

  function exportLibraryJSON() {

  function handleDocImportFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var doc = JSON.parse(reader.result);
        if (!doc || !Array.isArray(doc.items)) throw new Error("bad format");
        var id = newDocId();
        state.library.documents[id] = {
          id: id, title: doc.title || "가져온 문서", updatedAt: Date.now(), items: deepClone(doc.items),
          fontId: doc.fontId || "noto-sans", levelSettings: deepClone(doc.levelSettings || {}),
          lineWidth: typeof doc.lineWidth === "number" ? doc.lineWidth : 1,
          omitRootTitle: !!doc.omitRootTitle, maxDisplayLevel: doc.maxDisplayLevel == null ? null : doc.maxDisplayLevel,
          canvasMaxTextWidth: doc.canvasMaxTextWidth == null ? null : doc.canvasMaxTextWidth,
        };
        state.library.documentOrder.unshift(id);
        saveLibrary(); renderLibraryScreen();
        alert('"' + (doc.title || "가져온 문서") + '" 문서를 라이브러리에 추가했습니다.');
      } catch (e) { alert("문서를 가져오지 못했습니다. 올바른 백업(.json) 파일인지 확인해 주세요."); }
    };
    reader.readAsText(file);
  }
  function handleLibraryImportFile(file) {

        var data = JSON.parse(reader.result);

        if (!lib || typeof lib.documents !== "object") throw new Error("bad format");

  }

  function mergeLibrary(lib) {
    var idMap = {};

    docOrder.forEach(function (oldId) {

    });
    var nbOrder = (lib.notebookOrder && lib.notebookOrder.length) ? lib.notebookOrder : Object.keys(lib.notebooks || {});

  // generic drag-drop reorder list
  function makeDraggableList(container, ids, labelFn, onReorder, onRemove) {
    container.innerHTML = "";
    var dragIndex = null;
    ids.forEach(function (id, i) {
      var row = document.createElement("div");
      row.className = "dragRow"; row.draggable = true;
      var handle = document.createElement("span"); handle.className = "dragHandle"; handle.innerHTML = ICONS.grip;
      var label = document.createElement("span"); label.className = "dragLabel"; label.textContent = (i + 1) + ". " + labelFn(id, i);
      row.appendChild(handle); row.appendChild(label);
      if (onRemove) {
        var rm = document.createElement("button"); rm.className = "icbtn danger"; rm.innerHTML = ICONS.x; rm.title = "제거";
        rm.addEventListener("click", function () { onRemove(id); });
        row.appendChild(rm);
      }
      row.addEventListener("dragstart", function (e) { dragIndex = i; row.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
      row.addEventListener("dragend", function () { row.classList.remove("dragging"); });
      row.addEventListener("dragover", function (e) { e.preventDefault(); });
      row.addEventListener("drop", function (e) {
        e.preventDefault();
        if (dragIndex === null || dragIndex === i) return;
        var newIds = ids.slice();
        var moved = newIds.splice(dragIndex, 1)[0];
        newIds.splice(i, 0, moved);
        onReorder(newIds);
      });
      container.appendChild(row);
    });
  }

    var nb = state.library.notebooks[state.notebookViewer.notebookId];
    nbTocPanel.innerHTML = "";
    var head = document.createElement("div"); head.className = "modal-head"; head.innerHTML = '<span class="eyebrow" style="color:var(--ink)">목차</span>';
    var closeBtn = document.createElement("button"); closeBtn.className = "close-x"; closeBtn.innerHTML = ICONS.x;
    closeBtn.addEventListener("click", function () { nbTocOverlay.classList.remove("show"); });
    head.appendChild(closeBtn); nbTocPanel.appendChild(head);
    if (!nb || nb.docIds.length === 0) { nbTocPanel.appendChild(Object.assign(document.createElement("p"), { className: "hint", textContent: "문서가 없습니다." })); return; }
    var list = document.createElement("div"); nbTocPanel.appendChild(list);
    nb.docIds.forEach(function (docId, i) {
      var d = state.library.documents[docId];
      var row = document.createElement("div"); row.className = "dragRow"; row.draggable = true;
      row.innerHTML = '<span class="dragHandle">' + ICONS.grip + '</span><span class="dragLabel"></span>';
      row.querySelector(".dragLabel").textContent = (i + 1) + ". " + (d ? (d.title || "제목 없음") : "(삭제된 문서)");
      var goBtn = document.createElement("button"); goBtn.className = "tbtn"; goBtn.style.padding = "4px 9px"; goBtn.style.fontSize = "11px"; goBtn.textContent = "이동";
      goBtn.addEventListener("click", function () { nbPagesEl.scrollTo({ left: i * nbPagesEl.clientWidth, behavior: "smooth" }); nbTocOverlay.classList.remove("show"); });
      row.appendChild(goBtn);
      list.appendChild(row);
    });
    var dragIndex = null;
    Array.from(list.children).forEach(function (row, i) {
      row.addEventListener("dragstart", function () { dragIndex = i; row.classList.add("dragging"); });
      row.addEventListener("dragend", function () { row.classList.remove("dragging"); });
      row.addEventListener("dragover", function (e) { e.preventDefault(); });
      row.addEventListener("drop", function (e) {
        e.preventDefault();
        if (dragIndex === null || dragIndex === i) return;
        var newIds = nb.docIds.slice();
        var moved = newIds.splice(dragIndex, 1)[0];
        newIds.splice(i, 0, moved);
        nb.docIds = newIds; nb.updatedAt = Date.now(); saveLibrary();
        renderNbTocPanel(); buildNotebookPages();
      });
    });
  }

  // ---------------------------------------------------------------------
  // library screen
  // ---------------------------------------------------------------------
  document.getElementById("libBackupBtn").innerHTML = ICONS.download + "<span>전체 백업</span>";
  document.getElementById("libBackupBtn").addEventListener("click", exportLibraryJSON);
  document.getElementById("libImportBtn").innerHTML = ICONS.upload + "<span>가져오기</span>";
  document.getElementById("libImportBtn").addEventListener("click", function () { document.getElementById("libraryImportFile").click(); });
  document.getElementById("libraryImportFile").addEventListener("change", function (e) {
    var f = e.target.files[0]; if (f) handleLibraryImportFile(f); e.target.value = "";
  });
  document.getElementById("docImportFile").addEventListener("change", function (e) {
    var f = e.target.files[0]; if (f) handleDocImportFile(f); e.target.value = "";
  });

  var libTabsEl = document.getElementById("libTabs");
  libTabsEl.querySelectorAll("button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.libTab = btn.getAttribute("data-tab");
      libTabsEl.querySelectorAll("button").forEach(function (b) { b.classList.toggle("active", b === btn); });
      renderLibraryScreen();
    });
  });
  function renderLibraryScreen() {
    var body = document.getElementById("libBody");
    body.innerHTML = "";
    if (state.libTab === "docs") {
      var addRow = document.createElement("div"); addRow.style.display = "flex"; addRow.style.gap = "8px"; addRow.style.marginBottom = "14px"; addRow.style.flexWrap = "wrap";
      var addBtn = document.createElement("button"); addBtn.id = "addDocBtn"; addBtn.className = "primary-btn"; addBtn.style.marginBottom = "0"; addBtn.textContent = "+ 새 문서";
      addBtn.addEventListener("click", newDocument);
      var importDocBtn = document.createElement("button"); importDocBtn.className = "tbtn"; importDocBtn.textContent = "문서 가져오기";
      importDocBtn.addEventListener("click", function () { document.getElementById("docImportFile").click(); });
      addRow.appendChild(addBtn); addRow.appendChild(importDocBtn);
      body.appendChild(addRow);
      if (state.library.documentOrder.length === 0) {
        var empty = document.createElement("div"); empty.className = "libEmpty";
        empty.innerHTML = "아직 저장된 문서가 없습니다.<br>새 문서를 만들어 아웃라인을 붙여넣어 보세요.";
        body.appendChild(empty);
        return;
      }
      var grid = document.createElement("div"); grid.className = "libGrid";
      state.library.documentOrder.forEach(function (id) {
        var doc = state.library.documents[id]; if (!doc) return;
        var card = document.createElement("div"); card.className = "libCard";
        var title = document.createElement("div"); title.className = "libCardTitle"; title.textContent = doc.title || "제목 없음";
        title.addEventListener("click", function () { openDocument(id); });
        var meta = document.createElement("div"); meta.className = "libCardMeta";
        meta.textContent = (doc.items ? doc.items.length : 0) + "개 항목 · " + fmtDate(doc.updatedAt || Date.now());
        var btns = document.createElement("div"); btns.className = "libCardBtns";
        btns.appendChild(mkTbtn("열기", function () { openDocument(id); }));
        btns.appendChild(mkTbtn("이름변경", function () { renameDocumentPrompt(id); }));
        btns.appendChild(mkTbtn("복제", function () { duplicateDocument(id); }));
        btns.appendChild(mkTbtn("백업", function () { exportDocumentJSON(id); }));
        btns.appendChild(mkTbtn("삭제", function () { deleteDocument(id); }, true));
        card.appendChild(title); card.appendChild(meta); card.appendChild(btns);
        grid.appendChild(card);
      });
      body.appendChild(grid);
    } else {
      var addNoteBtn = document.createElement("button"); addNoteBtn.id = "addNoteBtn"; addNoteBtn.className = "primary-btn"; addNoteBtn.textContent = "+ 새 노트";
      addNoteBtn.addEventListener("click", newNotebookPrompt);
      body.appendChild(addNoteBtn);
      if (state.library.notebookOrder.length === 0) {
        var empty2 = document.createElement("div"); empty2.className = "libEmpty";
        empty2.innerHTML = "노트는 여러 다이어그램 문서를 순서대로 묶어 옆으로 넘기며 볼 수 있는 모음입니다.<br>새 노트를 만들어 문서를 추가해 보세요.";
        body.appendChild(empty2);
        return;
      }
      var grid2 = document.createElement("div"); grid2.className = "libGrid";
      state.library.notebookOrder.forEach(function (id) {
        var nb = state.library.notebooks[id]; if (!nb) return;
        var card = document.createElement("div"); card.className = "libCard";
        var title = document.createElement("div"); title.className = "libCardTitle"; title.textContent = nb.title || "새 노트";
        title.addEventListener("click", function () { openNotebookViewer(id); });
        var meta = document.createElement("div"); meta.className = "libCardMeta";
        meta.textContent = nb.docIds.length + "개 문서 · " + fmtDate(nb.updatedAt || Date.now());
        var btns = document.createElement("div"); btns.className = "libCardBtns";
        btns.appendChild(mkTbtn("보기", function () { openNotebookViewer(id); }));
        btns.appendChild(mkTbtn("구성", function () { openNotebookEditModal(id); }));
        btns.appendChild(mkTbtn("삭제", function () { deleteNotebook(id); }, true));
        card.appendChild(title); card.appendChild(meta); card.appendChild(btns);
        grid2.appendChild(card);
      });
      body.appendChild(grid2);
    }
  }
  function mkTbtn(label, fn, danger) {
    var b = document.createElement("button"); b.className = "tbtn"; b.textContent = label;
    if (danger) b.style.color = "var(--danger)";
    b.addEventListener("click", fn);
    return b;
  }

  // ---------------------------------------------------------------------
  // view switching
  // ---------------------------------------------------------------------
  function setView(view) {
    state.view = view;
    ["screenLibrary", "screenEditor", "screenNotebook"].forEach(function (sid) {
      document.getElementById(sid).classList.toggle("active", (sid === "screenLibrary" && view === "library") || (sid === "screenEditor" && view === "editor") || (sid === "screenNotebook" && view === "notebook"));
    });
    renderMobileBarVisibility();
  }

  // ---------------------------------------------------------------------
  // editor toolbar wiring
  // ---------------------------------------------------------------------
  var fontSelect = document.getElementById("fontSelect");
  FONTS.forEach(function (f) { var opt = document.createElement("option"); opt.value = f.id; opt.textContent = f.label; fontSelect.appendChild(opt); });
  fontSelect.addEventListener("change", function () {
    state.fontId = fontSelect.value;
    document.documentElement.style.setProperty("--doc-font", currentFont().css);
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load("400 20px " + currentFont().css), document.fonts.load("700 20px " + currentFont().css)]).then(renderSVG).catch(renderSVG);
    } else { renderSVG(); }
  });

  var sidebarToggleBtn = document.getElementById("sidebarToggleBtn");
  var mainEl = document.getElementById("main");
  var sidebarCollapsed = false;
  function updateSidebarToggleLabel() { sidebarToggleBtn.innerHTML = ICONS.sidebar + "<span>" + (sidebarCollapsed ? "사이드바 펼치기" : "사이드바 접기") + "</span>"; sidebarToggleBtn.classList.toggle("active", sidebarCollapsed); }
  updateSidebarToggleLabel();
  sidebarToggleBtn.addEventListener("click", function () {
    sidebarCollapsed = !sidebarCollapsed;
    mainEl.classList.toggle("sidebar-collapsed", sidebarCollapsed);
    updateSidebarToggleLabel();
  });

  var mobileToggleBtn = document.getElementById("mobileToggle");
  function updateMobileToggleLabel() {
    mobileToggleBtn.innerHTML = (state.mobileMode ? ICONS.smartphone : ICONS.monitor) + "<span>" + (state.mobileMode ? "모바일" : "데스크톱") + "</span>";
    mobileToggleBtn.classList.toggle("active", state.mobileMode);
  }
  mobileToggleBtn.addEventListener("click", function () { state.mobileMode = !state.mobileMode; applyMobileMode(); });

  var diagramModeBtn = document.getElementById("diagramModeToggle");
  function updateDiagramModeLabel() {
    diagramModeBtn.textContent = state.diagramMode === "vertical" ? "↓ 세로형" : "→ 가로형";
    diagramModeBtn.classList.toggle("active", state.diagramMode === "vertical");
  }
  diagramModeBtn.addEventListener("click", function () {
    state.diagramMode = state.diagramMode === "vertical" ? "tree" : "vertical";
    updateDiagramModeLabel();
    scheduleDiagramRender();
  });
  updateDiagramModeLabel();
  function applyMobileMode() { document.body.classList.toggle("mobile-mode", state.mobileMode); updateMobileToggleLabel(); renderMobileBarVisibility(); }

  var mobileTabsEl = document.getElementById("mobileTabs");
  mobileTabsEl.querySelectorAll("button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.mobileTab = btn.getAttribute("data-tab");
      mobileTabsEl.querySelectorAll("button").forEach(function (b) { b.classList.toggle("active", b === btn); });
      document.body.classList.toggle("tab-edit", state.mobileTab === "edit");
      document.body.classList.toggle("tab-preview", state.mobileTab === "preview");
    });
  });

  document.getElementById("settingsBtn").innerHTML = ICONS.settings + "<span>설정</span>";
  document.getElementById("settingsBtn").addEventListener("click", function () { renderSettingsPanel(); overlay.classList.add("show"); });
  overlay.addEventListener("click", function (e) { if (e.target === overlay) overlay.classList.remove("show"); });

  document.getElementById("importBtn").innerHTML = ICONS.upload + "<span>다이어그램으로 변환</span>";
  document.getElementById("importBtn").addEventListener("click", importFromPaste);

  var pasteSection = document.getElementById("pasteSection");
  document.getElementById("pasteToggle").addEventListener("click", function () { pasteSection.classList.toggle("collapsed"); });

  var multiSelectBtn = document.getElementById("multiSelectToggle");
  function updateMultiSelectLabel() { multiSelectBtn.textContent = state.multiSelectMode ? "다중 선택 끄기" : "다중 선택"; multiSelectBtn.classList.toggle("active", state.multiSelectMode); }
  updateMultiSelectLabel();
  multiSelectBtn.addEventListener("click", function () {
    state.multiSelectMode = !state.multiSelectMode;
    if (!state.multiSelectMode) state.selectedIds.clear();
    updateMultiSelectLabel(); renderList(); renderSVG(); renderSelectionBar();
  });

  var canvasWidthRange = document.getElementById("canvasWidthRange");
  var canvasWidthVal = document.getElementById("canvasWidthVal");
  function syncCanvasWidthControls() {
    var v = state.canvasMaxTextWidth || 0;
    canvasWidthRange.value = v;
    canvasWidthVal.textContent = v ? (v + "px") : "무제한";
  }
  canvasWidthRange.addEventListener("input", function () {
    var v = parseInt(canvasWidthRange.value, 10);
    state.canvasMaxTextWidth = v > 0 ? Math.max(80, v) : null;
    canvasWidthVal.textContent = v > 0 ? (Math.max(80, v) + "px") : "무제한";
    scheduleDiagramRender();
  });

  document.getElementById("addRootBtn").addEventListener("click", function () {
    var newItem = { id: nextId(), text: "", level: 0 };
    state.items.push(newItem); pendingFocusId = newItem.id; renderList(); scheduleDiagramRender();
  });
  document.getElementById("demoBtn").addEventListener("click", function () {
    document.getElementById("pasteBox").value = demoText();
    state.items = parseOutlineText(demoText()); state.selectedId = null; state.zoomRootId = null; renderAll();
  });
  document.getElementById("clearBtn").addEventListener("click", function () {
    document.getElementById("pasteBox").value = "";
    state.items = [{ id: nextId(), text: "", level: 0 }]; state.selectedId = null; state.zoomRootId = null; renderAll();
  });

  document.getElementById("zoomIn").addEventListener("click", function () { state.zoom = Math.min(3, state.zoom + 0.15); applyZoom(); });
  document.getElementById("zoomOut").addEventListener("click", function () { state.zoom = Math.max(0.25, state.zoom - 0.15); applyZoom(); });
  document.getElementById("zoomReset").innerHTML = ICONS.maximize;
  document.getElementById("zoomReset").addEventListener("click", function () { state.zoom = 1; applyZoom(); });
  document.getElementById("exportOutlineCopyBtn").addEventListener("click", copyOutlineText);
  document.getElementById("exportOutlineBtn").addEventListener("click", exportOutlineText);
  document.getElementById("exportTreeTextBtn").addEventListener("click", openTreeTextModal);
  document.getElementById("exportSvgBtn").addEventListener("click", exportSVG);
  document.getElementById("exportPdfBtn").addEventListener("click", exportPDF);
  document.getElementById("exportPngBtn").innerHTML = ICONS.download + "<span>PNG 내보내기</span>";
  document.getElementById("exportPngBtn").addEventListener("click", exportPNG);

  document.getElementById("backToLibBtn").innerHTML = ICONS.back;
  document.getElementById("backToLibBtn").addEventListener("click", goToLibrary);
  document.getElementById("saveDocBtn").innerHTML = ICONS.save + "<span>저장</span>";
  document.getElementById("saveDocBtn").addEventListener("click", function () { saveCurrentDocument(false); });
  document.getElementById("docTitleInput").addEventListener("change", function () { state.currentDocTitle = document.getElementById("docTitleInput").value; saveCurrentDocument(true); });

  window.addEventListener("resize", function () { if (window.innerWidth < 640 && !state.mobileMode) { state.mobileMode = true; applyMobileMode(); } });

  // ---------------------------------------------------------------------
  // orchestration + init
  // ---------------------------------------------------------------------
  function renderAll() { renderList(); renderSVG(); }

  buildMobileBar();
  applyMobileMode();
  document.body.classList.add("tab-edit");
  document.documentElement.style.setProperty("--doc-font", currentFont().css);
  syncLineWidthControls();
  syncCanvasWidthControls();

  if (state.library.documentOrder.length === 0) {
    var seedItems = parseOutlineText(demoText());
    var seedId = newDocId();
    state.library.documents[seedId] = { id: seedId, title: "예시 문서", updatedAt: Date.now(), items: seedItems, fontId: "noto-sans", levelSettings: {}, lineWidth: 1, omitRootTitle: false, maxDisplayLevel: null };
    state.library.documentOrder.unshift(seedId);
    saveLibrary();
  }
  setView("library");
  renderLibraryScreen();

  if (document.fonts && document.fonts.ready) { document.fonts.ready.catch(function () {}); }
})();
</script>
</body>
</html>
